global_markets:
  - market_code: "MY"
    name: "Malaysia (Bursa)"
    benchmark: "^KLSE"
    default_equity: "1155.KL"
    currency: "MYR"
    trading_days: 248
    config_file: "configs/malaysia.yaml"
  - market_code: "US"
    name: "United States"
    benchmark: "SPY"
    default_equity: "AAPL"
    currency: "USD"
    trading_days: 252
    config_file: "configs/usa.yaml"
  - market_code: "JP"
    name: "Japan"
    benchmark: "^N225"
    default_equity: "7203.T"
    currency: "JPY"
    trading_days: 245
    config_file: "configs/japan.yaml"
  - market_code: "EU"
    name: "Europe (DAX)"
    benchmark: "^GDAXI"
    default_equity: "SAP.DE"
    currency: "EUR"
    trading_days: 255
    config_file: "configs/europe.yaml"
  - market_code: "SG"
    name: "Singapore (STI)"
    benchmark: "^STI"
    default_equity: "D05.SI"
    currency: "SGD"
    trading_days: 250
  - market_code: "HK"
    name: "Hong Kong (HSI)"
    benchmark: "^HSI"
    default_equity: "0700.HK"
    currency: "HKD"
    trading_days: 248

cross_market_pairs:
  - asset: "^KLSE"
    macro_filter: "MYR=X"
    hypothesis: "USD/MYR depreciation regime degrades Malaysian domestic equity returns"
  - asset: "^KLSE"
    macro_filter: "BZ=F"
    hypothesis: "Brent crude momentum leads Bursa Malaysia energy & resource returns"
  - asset: "^N225"
    macro_filter: "JPY=X"
    hypothesis: "JPY depreciation boosts Nikkei export earnings and equity momentum"
  - asset: "^KLSE"
    macro_filter: "SPY"
    hypothesis: "US overnight performance provides strong opening direction for Bursa Malaysia"
