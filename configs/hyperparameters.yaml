# Multi-Market Estimation & Optimization Hyperparameters

lookback_windows:
  default_days: 504         # 2 Years of daily trading bars
  short_term_days: 126      # 6 Months
  medium_term_days: 252     # 1 Year
  long_term_days: 756       # 3 Years

rebalancing:
  default_frequency: "Monthly" # Monthly, Quarterly, Annual
  trading_days_per_year: 252  # Standard international trading days

monte_carlo:
  num_simulations: 10000
  time_horizon_days: 252
  random_seed: 42

black_litterman:
  tau: 0.05                  # Scale factor for covariance of prior
  risk_aversion: 2.50        # Implied market risk aversion coefficient (lambda)
  default_views:
    - view_name: "US Tech Outperformance"
      asset_long: "NVDA"
      asset_short: "7203.T"
      relative_return: 0.04   # US Tech outperforms Japan by 4%
      confidence: 0.70
    - view_name: "Malaysia Dividend Yield"
      asset_long: "1155.KL"
      view_return: 0.08      # Maybank expected return 8%
      confidence: 0.65
    - view_name: "Gold Inflation Hedge"
      asset_long: "GC=F"
      view_return: 0.07      # Gold expected return 7%
      confidence: 0.60

optimization:
  solver: "SLSQP"
  max_iterations: 1000
  tolerance: 1e-7
  risk_free_rate: 0.040      # 4.0% US short rate baseline
  risk_parity:
    method: "equal_risk_contribution" # asset_level or group_level
    tolerance: 1e-8
