# Multi-Asset Quantitative Universe Configuration
# Covers domestic Bursa Malaysia, global offshore equities, sovereign fixed income, commodities, and FX.

base_currency: "MYR"
domestic_market: "MY"

benchmarks:
  equity_domestic: "^KLSE"          # FTSE Bursa Malaysia KLCI
  equity_global: "SPY"             # S&P 500 ETF Trust
  balanced_domestic: "60_40_MGS"   # 60% ^KLSE + 40% MGS 10Y

asset_classes:
  - id: "domestic_equity"
    name: "Malaysian Equities (Bursa)"
    domicile: "domestic"
    assets:
      - symbol: "1155.KL"
        name: "Malayan Banking Berhad (Maybank)"
        sector: "Financials"
        weight_mkt: 0.18
      - symbol: "1023.KL"
